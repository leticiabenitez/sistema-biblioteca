<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Novo Livro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main>
        <div class="nome-pag">
            <h2>📚 Biblioteca</h2>
        </div>
        <div class="titulo-btn">
            <h1>Adicionar livro</h1>
            <a href="{{ url_for('home') }}" class="cancelar">Cancelar</a>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {%  for category, message in messages %}
                        <div class="flash {{ category }}">{{  message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="/criar" method="POST" enctype="multipart/form-data">
            <label for="titulo">Nome:</label>
            <input type="text" id="titulo" name="titulo" required placeholder="Ex.: Dom Casmurro">

            <label for="autor">Autor:</label>
            <input type="text" id="autor" name="autor" required placeholder="Ex.: Machado de Assis">

            <label for="ano_publicacao">Ano publicação:</label>
            <input type="number" id="ano_publicacao" name="ano_publicacao" required placeholder="Ex.: 1899">

            <label for="imagem">Capa do livro: </label>
            <input type="file" id="imagem" name="imagem" accept=".jpg">

            <button type="submit" id="botao">Salvar</button>
        </form>
    </main>
</body>
</html>
